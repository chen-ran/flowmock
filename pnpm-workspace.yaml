packages:
  - packages/*
  - apps/*

# pnpm blocks lifecycle scripts by default. esbuild ships a prebuilt binary
# for tsx and Vitest; unrs-resolver is the native binding behind the ESLint
# TypeScript resolver.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

# Optional install scripts of test-only SDK dependencies; nothing FlowMock
# runs needs them.
ignoredBuiltDependencies:
  - '@google/genai'
  - protobufjs

# Later happy-dom releases implement Element.animate but reject a cancelled
# animation's finished promise without marking it handled, so every Fluent
# motion cancelled in a test surfaces as an unhandled rejection. Browsers mark
# it handled, as the spec's cancel procedure requires. 20.11.1 has no
# Element.animate, and Fluent's motion settles without one. Vitest loads the
# environment through its own peer, so the pin has to be an override.
# https://drafts.csswg.org/web-animations-1/#cancel-an-animation
overrides:
  happy-dom: 20.11.1
  # monaco-editor 0.54.0 pins dompurify at exactly 3.1.7, which is behind every
  # advisory published since. 3.4.12 is the first release no advisory still
  # covers -- GHSA-c2j3-45gr-mqc4 names it as the fix. Droppable once Monaco's
  # own pin reaches a release in that position.
  # https://github.com/advisories/GHSA-c2j3-45gr-mqc4
  dompurify: 3.4.12

# The @fluentui/react-charts patch carries four fixes, all in code the package
# ships prebuilt, so none of them can be reached from a prop:
#
#   - CartesianChart measures its parent in an effect and publishes the result
#     as state. Under `useEffect` that lands after paint, so a reload shows one
#     frame of a zero-width chart; `useLayoutEffect` puts it before. The `width`
#     prop is only a change-detector, not a dimension, so an app-side
#     ResizeObserver cannot close the gap.
#   - AreaChart sizes its transparent hover target from that same measurement,
#     and `containerHeight - margins.top` is negative until it arrives. A
#     negative `width`/`height` on an SVG `rect` is an error, so the values are
#     clamped at zero.
#   - LineChart pushes two elements into `pointsForLine` without a key.
#   - The date axis rounds its domain outward twice — unconditionally through
#     d3's `nice()`, and again by 10% per side in markers mode — so the first
#     and last of the `tickValues` we pass land inside the plot instead of at
#     its ends, and the series stops short of both edges. That is the defect
#     reported upstream as microsoft/fluentui#35533 ("chart do not occupy the
#     entire width of the canvas"), closed pointing at `xMinValue`/`xMaxValue`,
#     which the date axis never reads — they exist only on the numeric sibling.
#     There is no supported way to ask for the domain we want
#     (microsoft/fluentui#32474: "We don't provide support to customize the
#     domain currently"), so both roundings are gated on the caller not having
#     supplied ticks.
#
# https://github.com/microsoft/fluentui/blob/4aa1084999a8c1ac7245724ad6c76210fe80acf6/packages/charts/react-charts/library/src/utilities/utilities.ts#L463-L468
# https://github.com/microsoft/fluentui/blob/4aa1084999a8c1ac7245724ad6c76210fe80acf6/packages/charts/react-charts/library/src/utilities/utilities.ts#L2232-L2265
# https://github.com/d3/d3/blob/ca958d45217b4c15332d971b935451a6d4c978f4/docs/d3-scale/time.md#L111-L124
# https://www.w3.org/TR/SVG2/shapes.html#RectElement
#
# Ported from Floway (MIT); see NOTICE.md. Keyed by exact version: a bare key
# resolves to strict: false, which lets a patch that stops applying degrade to a
# warning and ship unpatched.
patchedDependencies:
  '@fluentui/react-charts@9.3.22': patches/@fluentui__react-charts@9.3.22.patch
